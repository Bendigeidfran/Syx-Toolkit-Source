# Builds and tests every push and pull request. A tag such as Alpha-v3.3 also has the launchers signed through
# SignPath (each signing request needs manual approval there) and drafts a GitHub release with the signed zip.
# Only GitHub-hosted runners are used, and the build never sees game files: it needs none, and has none.
name: Build

on:
  push:
    branches: [main]
    tags: ['*-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Read the version
        id: version
        run: |
          $text = Get-Content core\src\syx\core\AppVersion.java -Raw
          $phase = [regex]::Match($text, 'PHASE\s*=\s*"(\w+)"').Groups[1].Value
          $major = [regex]::Match($text, 'MAJOR\s*=\s*(\d+)').Groups[1].Value
          $minor = [regex]::Match($text, 'MINOR\s*=\s*(\d+)').Groups[1].Value
          if (-not ($phase -and $major -and $minor)) { throw "Couldn't read the version from AppVersion.java." }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "$phase-v$major.$minor") {
            throw "The tag $env:GITHUB_REF_NAME doesn't match AppVersion, which is $phase-v$major.$minor."
          }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$major.$minor`n")

      - name: Fetch the libraries and build tools
        run: .\scripts\fetch-libs.ps1

      - name: Build
        run: .\scripts\build.ps1 -Jdk $env:JAVA_HOME

      - name: Test, without the game
        run: .\scripts\test.ps1 -Java $env:JAVA_HOME

      - name: Package
        run: .\scripts\package.ps1 -Jdk $env:JAVA_HOME -NoZip

      # The artifact holds the app folder's contents, so the launchers are at its root. jpackage's app\.jpackage.xml is
      # a hidden file, hence include-hidden-files.
      - name: Upload the unsigned app
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Syx-Toolkit-unsigned
          path: dist/Syx Toolkit/
          include-hidden-files: true
          if-no-files-found: error

  sign:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    # Waiting for a person to approve the signing request in SignPath counts against this.
    timeout-minutes: 360
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Sign the launchers with SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 20000
          output-artifact-directory: signed/Syx Toolkit
          parameters: |
            version: ${{ toJSON(needs.build.outputs.version) }}

      - name: Download the unsigned app, to compare
        uses: actions/download-artifact@v4
        with:
          name: Syx-Toolkit-unsigned
          path: unsigned/Syx Toolkit

      # Signing may change the two launchers and nothing else.
      - name: Check the signed app
        run: |
          $signed = (Resolve-Path 'signed\Syx Toolkit').Path
          $unsigned = (Resolve-Path 'unsigned\Syx Toolkit').Path
          function Get-Listing($folder) {
            Get-ChildItem $folder -Recurse -File -Force | ForEach-Object { $_.FullName.Substring($folder.Length + 1) } | Sort-Object
          }
          $signedFiles = Get-Listing $signed
          $unsignedFiles = Get-Listing $unsigned
          if (($signedFiles -join "`n") -ne ($unsignedFiles -join "`n")) { throw 'The signed app has different files from the unsigned one.' }
          foreach ($file in $signedFiles) {
            $same = (Get-FileHash (Join-Path $signed $file)).Hash -eq (Get-FileHash (Join-Path $unsigned $file)).Hash
            if ($file -in 'Syx Toolkit.exe', 'syx.exe') {
              $signature = Get-AuthenticodeSignature (Join-Path $signed $file)
              if ($signature.Status -ne 'Valid') { throw "$file isn't validly signed: $($signature.Status)." }
              Write-Output "$file is signed by $($signature.SignerCertificate.Subject)"
            } elseif (-not $same) {
              throw "Signing changed $file, which it shouldn't touch."
            }
          }

      - name: Zip and draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = "Syx-Toolkit-$tag.zip"
          .\scripts\zip-release.ps1 -App 'signed\Syx Toolkit' -Zip $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = "SHA-256 of $($zip): ``$hash```n`nThe launchers are signed. See the [code signing policy](https://github.com/$env:GITHUB_REPOSITORY#code-signing-policy)."
          gh release create $tag $zip --draft --verify-tag --title "Syx Toolkit $tag" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Drafting the release failed.' }
